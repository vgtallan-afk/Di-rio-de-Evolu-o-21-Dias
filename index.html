<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evolução Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Plus Jakarta Sans', sans-serif;
  background:#f5f7fb;
}

.screen { display:none; padding:20px; }
.active { display:block; }

.card {
  background:white;
  padding:20px;
  border-radius:20px;
  margin-bottom:15px;
  box-shadow:0 10px 20px rgba(0,0,0,0.05);
}

button {
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  background:#6366F1;
  color:white;
  font-weight:bold;
}

input, select {
  width:100%;
  padding:12px;
  margin-top:8px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid #ddd;
}

.tabbar {
  position:fixed;
  bottom:0;
  width:100%;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  border-top:1px solid #eee;
}

.tab {
  text-align:center;
  font-size:12px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="card">
    <h2 id="welcome">Olá</h2>
    <p>🔥 Streak: <span id="streak">0</span></p>
    <button onclick="go('log')">Registrar Dia</button>
  </div>
</div>

<!-- LOG -->
<div id="log" class="screen">
  <div class="card">
    <h3>Registro</h3>

    <input id="weight" type="number" placeholder="Peso (kg)">

    <input id="time" placeholder="Horário jejum (HH:MM)">

    <div id="time-error" style="color:red; display:none;">Horário inválido</div>

    <button onclick="saveLog()">Salvar</button>
  </div>
</div>

<!-- CALCULADORAS -->
<div id="calc" class="screen">
  <div class="card">
    <h3>Calculadoras</h3>

    <input id="c-weight" type="number" placeholder="Peso (kg)">
    <input id="c-height" type="number" placeholder="Altura (cm)">
    <input id="c-age" type="number" placeholder="Idade">

    <select id="c-goal">
      <option value="1">Emagrecer</option>
      <option value="2">Manter</option>
      <option value="3">Ganhar</option>
    </select>

    <button onclick="runCalc()">Calcular</button>

    <div id="result" style="margin-top:10px;"></div>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings" class="screen">
  <div class="card">
    <h3>Ajustes</h3>
    <p>Em breve...</p>
  </div>
</div>

<!-- MENU -->
<div class="tabbar">
  <div class="tab" onclick="go('home')">🏠<br>Início</div>
  <div class="tab" onclick="go('calc')">📊<br>Calc</div>
  <div class="tab" onclick="go('settings')">⚙️<br>Ajustes</div>
</div>

<script>

let db = JSON.parse(localStorage.getItem("app")) || {
  streak:0,
  last:null,
  logs:{}
};

function save(){ localStorage.setItem("app", JSON.stringify(db)); }

function go(scr){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(scr).classList.add("active");
}

function saveLog(){
  let weight = document.getElementById("weight").value;
  let time = document.getElementById("time").value;

  if(!weight){ alert("Peso obrigatório"); return; }

  let [h,m] = time.split(":").map(Number);
  if(h>23 || m>59){
    document.getElementById("time-error").style.display="block";
    return;
  }

  let today = new Date().toLocaleDateString();

  if(db.last){
    let ontem = new Date();
    ontem.setDate(ontem.getDate()-1);

    if(db.last === ontem.toLocaleDateString()){
      db.streak++;
    } else if(db.last !== today){
      db.streak=1;
    }
  } else {
    db.streak=1;
  }

  db.logs[today]={weight,time};
  db.last=today;

  save();
  update();
  go("home");
}

function update(){
  document.getElementById("streak").innerText=db.streak;
}

update();

function runCalc(){
  let w = +document.getElementById("c-weight").value;
  let h = +document.getElementById("c-height").value;
  let a = +document.getElementById("c-age").value;
  let g = document.getElementById("c-goal").value;

  if(!w||!h||!a){ alert("Preencha tudo"); return; }

  let tmb = 10*w + 6.25*h - 5*a - 161;

  let cal = g==1 ? tmb*1.2-300 : g==2 ? tmb*1.3 : tmb*1.5;

  let prot = w*2;
  let water = w*35;

  document.getElementById("result").innerHTML =
    "🔥 Calorias: "+Math.round(cal)+" kcal<br>"+
    "🥩 Proteína: "+Math.round(prot)+"g<br>"+
    "💧 Água: "+Math.round(water)+"ml";
}

/* máscara automática de hora */
document.getElementById("time").addEventListener("input", e=>{
  let v=e.target.value.replace(/\D/g,'');
  if(v.length>=3) v=v.slice(0,2)+":"+v.slice(2,4);
  e.target.value=v;
});

</script>

</body>
</html>
