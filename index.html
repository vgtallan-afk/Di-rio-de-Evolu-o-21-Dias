<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Evolução Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366F1;
            --secondary: #A855F7;
            --accent: #F43F5E;
            --bg: #F8FAFC;
            --glass: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.5);
        }

        [data-theme="dark"] {
            --bg: #0F172A;
            --glass: rgba(30, 41, 59, 0.8);
            --text: #F8FAFC;
            --text-light: #94A3B8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); transition: background 0.5s ease; }

        /* UI Elements */
        .screen { display: none; padding: 20px 20px 100px; max-width: 480px; margin: 0 auto; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .screen.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .glass { background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: 30px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); margin-bottom: 20px; }

        /* Streaks & Badges */
        .streak-fire { display: flex; align-items: center; gap: 8px; font-weight: 800; color: var(--accent); font-size: 18px; }
        
        /* Buttons */
        .btn-prime { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; padding: 20px; border-radius: 20px; font-weight: 700; width: 100%; cursor: pointer; box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3); }
        
        /* Nav Bar */
        .nav-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: var(--glass); backdrop-filter: blur(20px); border-radius: 25px; display: flex; justify-content: space-around; padding: 15px; border: 1px solid var(--card-border); z-index: 1000; }
        .nav-item { font-size: 20px; cursor: pointer; opacity: 0.5; transition: 0.3s; }
        .nav-item.active { opacity: 1; transform: scale(1.2); }

        /* Forms */
        input, select { width: 100%; padding: 16px; border-radius: 15px; border: 1px solid rgba(0,0,0,0.05); margin: 10px 0; font-size: 16px; }
        .error-msg { color: var(--accent); font-size: 12px; display: none; margin-top: -5px; margin-bottom: 10px; }

        h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
    </style>
</head>
<body data-theme="light">

    <div id="scr-home" class="screen active">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <div class="streak-fire">🔥 <span id="streak-count">0</span> DIAS</div>
            <div onclick="go('settings')" style="cursor: pointer;">⚙️</div>
        </div>
        
        <div class="glass">
            <h1 id="user-greeting">Olá! ✨</h1>
            <p style="opacity: 0.7; font-size: 14px;">Pronta para evoluir hoje?</p>
            <div style="margin-top: 20px; height: 10px; background: #E2E8F0; border-radius: 10px; overflow: hidden;">
                <div id="main-progress" style="width: 0%; height: 100%; background: linear-gradient(90deg, #6366F1, #A855F7); transition: 1s;"></div>
            </div>
            <p id="progress-desc" style="font-size: 11px; margin-top: 8px; font-weight: 600;"></p>
        </div>

        <button class="btn-prime" onclick="go('log')">Registrar Dia</button>
    </div>

    <div id="scr-calc" class="screen">
        <h1>Calculadoras</h1>
        <p style="margin-bottom: 20px; opacity: 0.7;">Ciência aplicada ao seu corpo.</p>
        
        <div class="glass">
            <h3>Bio-Métricas</h3>
            <label style="font-size: 12px;">Idade</label>
            <input type="number" id="calc-age" placeholder="Ex: 28">
            <label style="font-size: 12px;">Altura (cm)</label>
            <input type="number" id="calc-height" placeholder="Ex: 165">
            <label style="font-size: 12px;">Objetivo</label>
            <select id="calc-goal">
                <option value="lose">Emagrecer</option>
                <option value="maintain">Manter Peso</option>
                <option value="gain">Ganhar Músculo</option>
            </select>
            <button class="btn-prime" onclick="calculateMetabolism()" style="padding: 12px; margin-top: 10px;">Calcular Agora</button>
        </div>

        <div id="calc-results" class="glass" style="display: none; background: linear-gradient(135deg, #6366F1, #A855F7); color: white;">
            <h4 style="margin-bottom: 15px;">Seu Plano Sugerido:</h4>
            <div id="results-content" style="font-size: 14px; line-height: 2;"></div>
        </div>
    </div>

    <div id="scr-log" class="screen">
        <div class="glass">
            <h2>Registro Diário</h2>
            <label>Peso Atual (kg)</label>
            <input type="number" id="log-weight" step="0.1">

            <label>Horário Início Jejum (HH:MM)</label>
            <input type="text" id="fasting-start" placeholder="00:00" maxlength="5">
            <div id="err-fasting" class="error-msg">Horário inválido.</div>

            <label>Horário Término Jejum (HH:MM)</label>
            <input type="text" id="fasting-end" placeholder="00:00" maxlength="5">

            <label>Água (Copos de 250ml)</label>
            <input type="number" id="log-water">

            <button class="btn-prime" onclick="saveEntry()" style="margin-top: 20px;">Finalizar e Brilhar</button>
        </div>
    </div>

    <div id="scr-settings" class="screen">
        <h1>Ajustes</h1>
        <div class="glass">
            <h3>Customização</h3>
            <div style="display: flex; justify-content: space-between; align-items: center; margin: 20px 0;">
                <span>Modo Escuro</span>
                <input type="checkbox" id="dark-mode-toggle" style="width: auto;" onchange="toggleTheme()">
            </div>
            
            <hr style="opacity: 0.1; margin: 20px 0;">
            
            <h3>Notificações</h3>
            <label>Horário do Lembrete</label>
            <input type="time" id="notif-time" value="20:00">
            <button class="btn-prime" style="padding: 10px;" onclick="saveSettings()">Salvar Ajustes</button>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="go('home')">🏠</div>
        <div class="nav-item" onclick="go('calc')">📊</div>
        <div class="nav-item" onclick="go('settings')">⚙️</div>
    </div>

    <script>
        // --- LOGICA DE ESTADO ---
        let db = JSON.parse(localStorage.getItem('evolucao_v3')) || {
            user: { name: 'Allan', streak: 0, lastEntry: null, theme: 'light' },
            logs: {},
            settings: { notifTime: '20:00' }
        };

        function save() { localStorage.setItem('evolucao_v3', JSON.stringify(db)); }

        // --- NAVEGAÇÃO ---
        function go(scr) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('scr-' + scr).classList.add('active');
            document.querySelectorAll('.nav-item').forEach((item, idx) => {
                item.classList.toggle('active', ['home', 'calc', 'settings'].includes(scr) && idx === ['home', 'calc', 'settings'].indexOf(scr));
            });
            if(scr === 'home') refreshDashboard();
        }

        // --- MÁSCARA DE HORÁRIO ---
        function setupTimeMask(id) {
            const el = document.getElementById(id);
            el.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, '');
                if (v.length >= 3) v = v.substring(0, 2) + ':' + v.substring(2, 4);
                e.target.value = v;
            });

            el.addEventListener('blur', (e) => {
                const parts = e.target.value.split(':');
                const h = parseInt(parts[0]);
                const m = parseInt(parts[1]);
                const isValid = h >= 0 && h < 24 && m >= 0 && m < 60;
                document.getElementById('err-fasting').style.display = (e.target.value && !isValid) ? 'block' : 'none';
            });
        }
        setupTimeMask('fasting-start');
        setupTimeMask('fasting-end');

        // --- DASHBOARD & STREAK ---
        function refreshDashboard() {
            document.getElementById('streak-count').innerText = db.user.streak;
            const logCount = Object.keys(db.logs).length;
            const progress = (logCount / 21) * 100;
            document.getElementById('main-progress').style.width = Math.min(progress, 100) + '%';
            document.getElementById('progress-desc').innerText = logCount >= 21 ? 
                `Jornada Infinita: Dia ${logCount}` : `Faltam ${21 - logCount} dias para concluir o ciclo.`;
        }

        // --- CALCULADORA AVANÇADA ---
        function calculateMetabolism() {
            const age = parseInt(document.getElementById('calc-age').value);
            const height = parseInt(document.getElementById('calc-height').value);
            const weight = parseFloat(db.logs[Object.keys(db.logs).pop()]?.weight || 70); // Usa o último peso ou 70
            const goal = document.getElementById('calc-goal').value;

            if(!age || !height) return alert("Preencha idade e altura para calcular.");

            // Harris-Benedict para Mulheres (Assumindo público ClaraMente)
            let tmb = 655 + (9.6 * weight) + (1.8 * height) - (4.7 * age);
            let water = Math.round(weight * 35);
            
            let protein, calories;
            if(goal === 'lose') { calories = tmb * 1.1; protein = weight * 2; }
            else if(goal === 'gain') { calories = tmb * 1.5; protein = weight * 2.2; }
            else { calories = tmb * 1.3; protein = weight * 1.5; }

            document.getElementById('calc-results').style.display = 'block';
            document.getElementById('results-content').innerHTML = `
                💧 Água: ${water}ml/dia<br>
                🔥 Calorias Base: ${Math.round(calories)} kcal<br>
                🥩 Proteína: ${Math.round(protein)}g/dia<br>
                🍞 Carbos: ${Math.round((calories * 0.4) / 4)}g/dia
            `;
        }

        // --- SALVAR REGISTRO COM OFENSIVA ---
        function saveEntry() {
            const hoje = new Date().toLocaleDateString();
            if(db.logs[hoje]) return alert("Você já brilhou hoje!");

            const lastEntry = db.user.lastEntry;
            const ontem = new Date(); ontem.setDate(ontem.getDate() - 1);
            
            if(lastEntry === ontem.toLocaleDateString()) db.user.streak++;
            else if(lastEntry !== hoje) db.user.streak = 1;

            db.logs[hoje] = {
                weight: document.getElementById('log-weight').value,
                water: document.getElementById('log-water').value,
                timestamp: new Date().getTime()
            };
            db.user.lastEntry = hoje;
            save();
            alert("Evolução salva! 🔥");
            go('home');
        }

        function toggleTheme() {
            const theme = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', theme);
            db.user.theme = theme;
            save();
        }

        window.onload = () => {
            document.body.setAttribute('data-theme', db.user.theme);
            refreshDashboard();
        };
    </script>
</body>
</html>
