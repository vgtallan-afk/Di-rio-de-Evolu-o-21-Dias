<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Diário de Evolução</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F8FAFC;
            --glass: rgba(255, 255, 255, 0.8);
            --accent: linear-gradient(135deg, #6366F1 0%, #A855F7 100%);
            --text: #1E293B;
            --text-light: #64748B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }

        .screen { display: none; padding: 20px; max-width: 450px; margin: 0 auto; animation: fadeIn 0.4s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            margin-bottom: 20px;
        }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 18px; text-align: center; border: 1px solid #F1F5F9; }
        .stat-val { display: block; font-size: 20px; font-weight: 700; color: #6366F1; }
        .stat-label { font-size: 11px; text-transform: uppercase; color: var(--text-light); letter-spacing: 1px; }

        .btn {
            background: var(--accent); color: white; border: none; padding: 18px;
            border-radius: 18px; font-weight: 600; width: 100%; cursor: pointer;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
        }

        .day-badge {
            background: #EEF2FF; color: #6366F1; padding: 6px 12px;
            border-radius: 20px; font-size: 12px; font-weight: 700;
        }

        input, textarea, select {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #E2E8F0;
            margin-top: 8px; margin-bottom: 15px; background: white;
        }
    </style>
</head>
<body>

    <div id="screen-welcome" class="screen active">
        <div style="height: 30vh"></div>
        <h1>Bem-vinda à sua<br>nova jornada.</h1>
        <p style="margin: 15px 0 30px; color: var(--text-light)">Transformação consciente em 21 dias.</p>
        <button class="btn" onclick="goTo('setup')">Começar Agora</button>
    </div>

    <div id="screen-setup" class="screen">
        <div class="glass-card">
            <h2>Configuração</h2>
            <p>Como devemos te chamar?</p>
            <input type="text" id="user-name" placeholder="Nome">
            <p>Peso inicial (kg)</p>
            <input type="number" id="start-weight" step="0.1" placeholder="00.0">
            <button class="btn" onclick="saveSetup()">Criar Meu Diário</button>
        </div>
    </div>

    <div id="screen-home" class="screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 id="welcome-msg">Olá!</h2>
            <span class="day-badge" id="display-date">20 de Maio</span>
        </div>

        <div class="stat-grid">
            <div class="stat-card">
                <span class="stat-label">Dia Atual</span>
                <span class="stat-val" id="current-day-num">1/21</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Peso Perdido</span>
                <span class="stat-val" id="weight-loss">0.0 kg</span>
            </div>
        </div>

        <div class="glass-card" style="background: var(--accent); color: white;">
            <p style="color: rgba(255,255,255,0.8)">Progresso Geral</p>
            <div style="height: 8px; background: rgba(255,255,255,0.2); border-radius: 10px; margin: 10px 0;">
                <div id="progress-bar" style="height: 100%; background: white; width: 0%; border-radius: 10px; transition: 1s;"></div>
            </div>
            <p id="progress-text" style="font-size: 12px; color: white;">0% concluído</p>
        </div>

        <button class="btn" onclick="goTo('log')">Registrar Dia Hoje</button>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('evolucao_21')) || {
            userName: '', startWeight: 0, startDate: null, logs: {}
        };

        function goTo(s) {
            document.querySelectorAll('.screen').forEach(scr => scr.classList.remove('active'));
            document.getElementById('screen-'+s).classList.add('active');
            if(s === 'home') updateDashboard();
        }

        function saveSetup() {
            state.userName = document.getElementById('user-name').value;
            state.startWeight = parseFloat(document.getElementById('start-weight').value);
            state.startDate = new Date().getTime(); // Salva o exato momento do início
            localStorage.setItem('evolucao_21', JSON.stringify(state));
            goTo('home');
        }

        function updateDashboard() {
            document.getElementById('welcome-msg').innerText = `Oi, ${state.userName}! ✨`;
            
            // Lógica de Data Atual
            const hoje = new Date();
            const opcoes = { day: 'numeric', month: 'long' };
            document.getElementById('display-date').innerText = hoje.toLocaleDateString('pt-BR', opcoes);

            // Cálculo do Dia da Jornada
            const inicio = new Date(state.startDate);
            const diff = Math.floor((hoje - inicio) / (1000 * 60 * 60 * 24)) + 1;
            const diaAtual = Math.min(Math.max(diff, 1), 21);
            document.getElementById('current-day-num').innerText = `${diaAtual}/21`;

            // Cálculo de Peso
            const logsArray = Object.values(state.logs);
            if(logsArray.length > 0) {
                const ultimoPeso = logsArray[logsArray.length - 1].weight;
                const perda = state.startWeight - ultimoPeso;
                document.getElementById('weight-loss').innerText = `${perda.toFixed(1)} kg`;
            }

            // Barra de Progresso
            const perc = (Object.keys(state.logs).length / 21) * 100;
            document.getElementById('progress-bar').style.width = perc + '%';
            document.getElementById('progress-text').innerText = `${Math.round(perc)}% concluído`;
        }

        if(state.startDate) goTo('home');
    </script>
</body>
</html>
